# Startup splash: layout and wording shared by tools/draw_splash.py (static
# layers) and tools/launcher/Launcher.cs (the line and the version drawn at run time).
# Sizes are logical pixels at 100% display scaling; the PNG layers are 2x.
# key=value, one per line.

# Whole image, including the room left for the soft shadow.
width=476
height=296
# The card inside it: left, top, width, height, corner radius.
card=28,24,420,240,18

# Static layers (drawn into the PNGs).
heart_center=238,80
heart_width=68
wordmark=LuvBox
wordmark_y=130
wordmark_size=24
tagline=좋아요한 사진과 영상을 내 폴더에
tagline_y=156
tagline_size=12

# Run-time text (drawn by the launcher).
status_y=204
status_size=14
version_right=430
version_y=248
version_size=10

# One line, chosen when the card appears and kept until the window opens:
# a new version being put in place, or any other start.
status.update=새 버전으로 업데이트하는 중
status.open=보관함을 여는 중
