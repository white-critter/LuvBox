<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuvBox · X 계정 연결</title>
<link rel="stylesheet" href="connect.css"><script src="extension-page.js" defer></script>
</head><body><main>
<h1>LuvBox에 X 계정 연결</h1>
<p id="status">앱의 연결 요청을 확인하고 있습니다…</p>
<p>연결 코드 <code id="pairing-code">—</code></p>
<label><input id="confirm-code" type="checkbox"> LuvBox 앱에 표시된 연결 코드와 같습니다.</label>
<p>이 확장은 현재 브라우저의 X 로그인만 읽습니다. 아래에서 계정을 확인하고 연결을
승인하면 X 로그인 쿠키와 계정 정보가 이 컴퓨터의 LuvBox에 전달됩니다.</p>
<button id="inspect" type="button" disabled>현재 X 계정 확인</button>
<p id="account" class="account"></p>
<button id="connect" type="button" hidden disabled>계정 연결</button>
<p class="help">X 계정을 바꾸려면 먼저 이 브라우저의 x.com에서 계정을 전환한 다음 다시 확인하세요.
비공개 창·Firefox 컨테이너는 지원하지 않습니다. 앱에서 취소하거나 이 탭을 닫아 중단할 수 있습니다.</p>
</main></body></html>
